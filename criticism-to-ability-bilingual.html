            {num: 123, cn: "你很固執", en: "You're stubborn", info: "模型更新能力不足 | Model update ability insufficient", ability: "認知彈性能力 | Cognitive flexibility ability"},
            {num: 124, cn: "你都不聽別人說", en: "You never listen to others", info: "傾聽能力不足 | Listening ability insufficient", ability: "深度傾聽能力 | Deep listening ability"},
            {num: 125, cn: "你一直打斷別人", en: "You always interrupt others", info: "等待能力不足 | Waiting ability insufficient", ability: "自我控制能力 | Self-control ability"},
            {num: 262, cn: "你一直不會用AI", en: "You don't know how to use AI", info: "AI協作不足 | AI collaboration insufficient", ability: "AI協作能力 | AI collaboration ability"},
            {num: 263, cn: "你一直直接相信AI", en: "You directly believe AI", info: "驗證能力不足 | Verification ability insufficient", ability: "AI驗證能力 | AI verification ability"},
            {num: 264, cn: "你一直不會下Prompt", en: "You don't know how to write Prompt", info: "提問品質不足 | Question quality insufficient", ability: "Prompt設計能力 | Prompt design ability"},
            {num: 300, cn: "你一直討厭別人指出你的缺點", en: "You hate it when people point out your flaws", info: "把回饋當成人格否定 | Treating feedback as personal rejection", ability: "高維更新能力 | Higher-dimensional update ability"},
            {num: 301, cn: "你一直沒有改變", en: "You never change", info: "更新機制不存在 | Update mechanism non-existent", ability: "持續更新能力 | Continuous update ability"},
            {num: 360, cn: "老師一直批評你", en: "Teacher always criticizes you", info: "老師是在提供新的訓練資料 | Teacher is providing new training data", ability: "終身更新能力 | Lifelong update ability"}
        ];
        
        function renderPhilosophy() {
            const container = document.getElementById('philosophyCards');
            container.innerHTML = '';
            philosophyData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'bilingual-card';
                card.innerHTML = `
                    <div class="card-row full">
                        <div class="lang-block">
                            <span class="lang-label">中文 Chinese</span>
                            <div class="lang-text">${item.title}</div>
                        </div>
                    </div>
                    <div class="card-row full">
                        <div class="lang-block">
                            <span class="lang-label">英文 English</span>
                            <div class="lang-text">${item.en}</div>
                            <button class="tts-btn" onclick="speak('${item.en}')">🔊 Play English</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function renderSteps() {
            const container = document.getElementById('stepsCards');
            container.innerHTML = '';
            stepsData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'bilingual-card';
                card.innerHTML = `
                    <div class="card-number">Step ${item.step}</div>
                    <div class="card-row">
                        <div class="lang-block">
                            <span class="lang-label">中文 Chinese</span>
                            <div class="lang-text"><strong>${item.title}</strong></div>
                            <div class="lang-text" style="margin-top:5px; font-size:14px;">${item.question}</div>
                        </div>
                        <div class="lang-block">
                            <span class="lang-label">英文 English</span>
                            <div class="lang-text"><strong>${item.en}</strong></div>
                            <div class="lang-text" style="margin-top:5px; font-size:14px;">${item.qa}</div>
                            <button class="tts-btn" onclick="speak('${item.en}. ${item.qa}')">🔊 Play</button>
                        </div>
                    </div>
                    <div class="card-row">
                        <div class="lang-block">
                            <span class="lang-label">卡住 Stuck</span>
                            <div class="lang-text">${item.stuck}</div>
                        </div>
                        <div class="lang-block">
                            <span class="lang-label">突破 Breakthrough</span>
                            <div class="lang-text">${item.breakthrough}</div>
                        </div>
                    </div>
                    <div class="card-row full">
                        <div class="lang-block">
                            <span class="lang-label">生成能力 Generated Ability</span>
                            <div class="lang-text">${item.ability}</div>
                            <button class="tts-btn" onclick="speak('${item.ability}')">🔊 Play</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        function renderModules() {
            const container = document.getElementById('modulesCards');
            container.innerHTML = '';
            modulesData.forEach((module, idx) => {
                const card = document.createElement('div');
                card.className = 'bilingual-card';
                const contentHtml = module.content.map(line => {
                    const parts = line.split(' | ');
                    return `<div class="card-row"><div class="lang-block"><span class="lang-label">中文</span><div class="lang-text">${parts[0]}</div></div><div class="lang-block"><span class="lang-label">English</span><div class="lang-text">${parts[1]}</div><button class="tts-btn" onclick="speak('${parts[1]}')">🔊 Play</button></div></div>`;
                }).join('');
                
                card.innerHTML = `
                    <div class="card-number">Module ${module.num}</div>
                    <div class="card-row">
                        <div class="lang-block">
                            <span class="lang-label">中文</span>
                            <div class="lang-text"><strong>${module.title}</strong></div>
                        </div>
                        <div class="lang-block">
                            <span class="lang-label">English</span>
                            <div class="lang-text"><strong>${module.en}</strong></div>
                            <button class="tts-btn" onclick="speak('${module.en}')">🔊 Play</button>
                        </div>
                    </div>
                    ${contentHtml}
                `;
                container.appendChild(card);
            });
        }
        
        function renderDatabase() {
            const container = document.getElementById('databaseCards');
            container.innerHTML = '';
            let shown = 0;
            
            databaseData.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'bilingual-card';
                card.id = `db-${item.num}`;
                
                const infoLine = item.info.split(' | ');
                const abilityLine = item.ability.split(' | ');
                
                card.innerHTML = `
                    <div class="card-number">#${String(item.num).padStart(3, '0')}</div>
                    <div class="card-row">
                        <div class="lang-block">
                            <span class="lang-label">批評 Criticism</span>
                            <div class="lang-text">${item.cn}</div>
                        </div>
                        <div class="lang-block">
                            <span class="lang-label"></span>
                            <div class="lang-text">${item.en}</div>
                            <button class="tts-btn" onclick="speak('${item.en}')">🔊 Play</button>
                        </div>
                    </div>
                    <div class="card-row">
                        <div class="lang-block">
                            <span class="lang-label">真正資訊 Real Info</span>
                            <div class="lang-text">${infoLine[0]}</div>
                        </div>
                        <div class="lang-block">
                            <span class="lang-label"></span>
                            <div class="lang-text">${infoLine[1]}</div>
                            <button class="tts-btn" onclick="speak('${infoLine[1]}')">🔊 Play</button>
                        </div>
                    </div>
                    <div class="card-row">
                        <div class="lang-block">
                            <span class="lang-label">能力節點 Ability Node</span>
                            <div class="lang-text">${abilityLine[0]}</div>
                        </div>
                        <div class="lang-block">
                            <span class="lang-label"></span>
                            <div class="lang-text">${abilityLine[1]}</div>
                            <button class="tts-btn" onclick="speak('${abilityLine[1]}')">🔊 Play</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
                shown++;
            });
            
            document.getElementById('counter').innerHTML = `📊 已展示 ${shown} 個案例 | Showing ${shown} cases`;
        }
        
        function switchTab(tabName) {
            document.querySelectorAll('.content-section').forEach(el => {
                el.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }
        
        function speak(text) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            speechSynthesis.speak(utterance);
        }
        
        function searchContent() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            if (!searchText) {
                alert('請輸入搜尋內容 | Please enter search text');
                return;
            }
            
            let found = 0;
            const sections = ['philosophyCards', 'stepsCards', 'modulesCards', 'databaseCards'];
            
            sections.forEach(sectionId => {
                const section = document.getElementById(sectionId);
                if (section) {
                    Array.from(section.children).forEach(card => {
                        const text = card.innerText.toLowerCase();
                        if (text.includes(searchText)) {
                            card.style.display = 'block';
                            found++;
                        } else {
                            card.style.display = 'none';
                        }
                    });
                }
            });
            
            alert(`找到 ${found} 個相符項目 | Found ${found} matches`);
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderPhilosophy();
            renderSteps();
            renderModules();
            renderDatabase();
        });
    </script>
</body>
</html>
