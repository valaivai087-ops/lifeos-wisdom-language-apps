        let expandedCards = {};
        let currentSection = 'intro';
        let textCache = {};  // 用於存儲長文本
        
        function cacheText(text) {
            const id = 'text_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            textCache[id] = text;
            return id;
        }
        
        function speakCachedText(textId) {
            const text = textCache[textId];
            if (text) {
                speakText(text);
            }
        }
        
        function loadSection(sectionKey) {
            currentSection = sectionKey;
            const section = contentData[sectionKey];
            if (!section) return;
            
            const content = document.getElementById('content-area');
            
            // 為標題英文創建緩存ID
            const titleTextId = cacheText(section.titleEn);
            
            let html = `
                <div class="section">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <div>
                            <div class="section-title">${section.title}</div>
                            <div class="section-subtitle">${section.titleEn}</div>
                        </div>
                        <button class="btn-small" onclick="speakCachedText('${titleTextId}'); event.stopPropagation();" title="播放英文標題" style="white-space: nowrap;">🔊 Play</button>
                    </div>
            `;
            
            // 引言特殊處理
            if (sectionKey === 'intro') {
                const introTextId = cacheText(section.content);
                const introEnTextId = cacheText(section.contentEn);
                html += `<div class="warning-box" style="position: relative;">
                    <button class="btn-small" onclick="speakCachedText('${introEnTextId}'); event.stopPropagation();" title="播放引言英文" style="position: absolute; top: 10px; right: 10px;">🔊</button>
                    ${section.content}
                </div>`;
                
                html += '<div class="divider"></div>';
                html += '<div style="font-size: 14px; color: #1A2B5F; line-height: 2;">如果一個人沒有這九大結構，會發生什麼：<br><br>';
                section.warnings.forEach((w, idx) => {
                    html += `<div style="margin-bottom: 12px;"><span style="font-weight: bold; color: #C9960C;">${w.zh}</span><br>
                    <span style="color: #0A7A72;">${w.en}</span><br>
                    <span style="color: #999;">→ ${w.result}</span></div>`;
                });
                html += '</div>';
            }
            // 導航和案例
            else if (sectionKey === 'navigation' || sectionKey === 'cases') {
                if (section.question) {
                    html += `<div style="margin: 15px 0; padding: 15px; background: rgba(201,150,12,0.1); border-left: 4px solid #C9960C;">
                        <strong>${section.question}</strong>
                    </div>`;
                }
                html += `<div style="white-space: pre-wrap; line-height: 1.8; font-size: 14px; color: #1A2B5F; margin-top: 20px;">${section.content}</div>`;
            }
            // 結構詳細頁
            else {
                if (section.question) {
                    html += `<div style="margin: 15px 0; padding: 15px; background: rgba(201,150,12,0.1); border-left: 4px solid #C9960C;">
                        <strong>${section.question}</strong>
                    </div>`;
                }
                if (section.function) {
                    html += `<div style="margin: 15px 0; padding: 15px; background: rgba(10,122,114,0.1); border-left: 4px solid #0A7A72;">
                        <strong>${section.function}</strong>
                    </div>`;
                }
                if (section.description) {
                    html += `<div class="warning-box">${section.description}</div>`;
                }
                
                html += '<div class="divider"></div>';
                html += '<div style="font-size: 12px; color: #999; margin-bottom: 20px;">12個核心能力領域</div>';
                
                section.items.forEach((item, idx) => {
                    const cardId = `${sectionKey}-${idx}`;
                    const isExpanded = expandedCards[cardId];
                    const itemTextId = cacheText(item.en);
                    html += `
                        <div class="card" id="card-${cardId}">
                            <div class="card-header">
                                <div>
                                    <div class="card-title">${item.zh}</div>
                                    <div class="card-subtitle">${item.en}</div>
                                </div>
                                <div class="card-controls">
                                    <button class="btn-small" onclick="speakCachedText('${itemTextId}'); event.stopPropagation();" title="播放英文">🔊</button>
                                    <button class="btn-small" onclick="toggleCard('${cardId}')">
                                        ${isExpanded ? '▲' : '▼'}
                                    </button>
                                </div>
                            </div>
                            <div class="card-content ${isExpanded ? 'visible' : ''}">
                                <div style="margin-bottom: 10px;">
                                    <div style="font-weight: bold; color: #1A2B5F;">${item.desc}</div>
                                    <div style="color: #0A7A72; font-size: 12px; margin-top: 5px;">${item.descEn}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            
            html += '</div>';
            content.innerHTML = html;
            
            // 更新導航 (安全的方式)
            setTimeout(() => {
                document.querySelectorAll('.nav-item').forEach(item => {
                    if (item.getAttribute('onclick')?.includes(sectionKey)) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }, 10);
        }
        
        function toggleCard(cardId) {
            expandedCards[cardId] = !expandedCards[cardId];
            const card = document.getElementById(`card-${cardId}`);
            if (card) {
                const content = card.querySelector('.card-content');
                const btn = card.querySelector('.btn-small');
                if (content) {
                    content.classList.toggle('visible');
                    if (btn) btn.textContent = expandedCards[cardId] ? '▲' : '▼';
                }
            }
        }
        
        function toggleAllCards() {
            const allExpanded = Object.values(expandedCards).every(v => v === true);
            document.querySelectorAll('.card-content').forEach(content => {
                if (allExpanded) {
                    content.classList.remove('visible');
                } else {
                    content.classList.add('visible');
                }
            });
            document.querySelectorAll('.btn-small').forEach(btn => {
                btn.textContent = allExpanded ? '▼' : '▲';
            });
            Object.keys(expandedCards).forEach(key => {
                expandedCards[key] = !allExpanded;
            });
        }
        
        function speakText(text) {
            // 停止任何正在播放的語音
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
            }
            
            // 檢查是否支援語音合成
            if (!('speechSynthesis' in window)) {
                alert('您的瀏覽器不支援語音功能');
                return;
            }
            
            try {
                // 創建語音對象
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;      // 語速：0.5-2.0
                utterance.pitch = 1.0;      // 音調：0.5-2.0
                utterance.volume = 1.0;     // 音量：0-1
                
                // 添加事件監聽
                utterance.onstart = () => {
                    console.log('開始播放:', text.substring(0, 30));
                };
                
                utterance.onend = () => {
                    console.log('播放完成');
                };
                
                utterance.onerror = (event) => {
                    console.error('語音播放錯誤:', event.error);
                };
                
                // 播放語音
                window.speechSynthesis.speak(utterance);
            } catch (error) {
                console.error('語音功能錯誤:', error);
            }
        }
        
        function filterContent(searchTerm) {
            const cards = document.querySelectorAll('.card');
            let count = 0;
            cards.forEach(card => {
                const title = card.querySelector('.card-title')?.textContent.toLowerCase() || '';
                const subtitle = card.querySelector('.card-subtitle')?.textContent.toLowerCase() || '';
                const match = title.includes(searchTerm.toLowerCase()) || subtitle.includes(searchTerm.toLowerCase());
                card.style.display = match ? 'block' : 'none';
                if (match) count++;
            });
        }
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadSection('intro');
        });
    </script>
