            padding: 0;

            --gold: #B8860B;
            --light-navy: #1A2B5F;
            --bg-light: #F8F9FA;
            --text-primary: #0D1B3E;
            --text-secondary: #666;
            --border: #E0E0E0;
        }

        body {

            background-color: #FFFFFF;
            color: var(--text-primary);
            line-height: 1.8;
            font-size: 16px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--light-navy) 100%);
            color: white;
            padding: 50px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(13, 27, 62, 0.15);
        }

        .header h1 {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .header p {
            font-size: 20px;
            opacity: 0.95;
            font-weight: 300;
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin: 30px 0 50px 0;
            padding: 20px;
            background: var(--bg-light);
            border-radius: 8px;
        }

        .stat-box {
            text-align: center;
            padding: 20px;
            border-radius: 6px;
            background: white;
            border: 2px solid var(--border);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: var(--gold);
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* Search */
        .search-section {
            margin-bottom: 40px;
        }

        .search-bar {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: 2px solid var(--teal);
            border-radius: 8px;
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #F8F9FA;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--gold);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.1);
        }

        /* Module Grid */
        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .module-quick-card {
            background: linear-gradient(135deg, var(--teal) 0%, var(--light-navy) 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 107, 125, 0.2);
        }

        .module-quick-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px rgba(184, 134, 11, 0.25);
        }

        .module-number {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .module-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .module-count {
            font-size: 14px;
            opacity: 0.85;
        }

        /* Module Detail */
        .module-detail-section {
            background: white;
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .module-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
            color: white;
            padding: 30px;
            cursor: pointer;
            user-select: none;
        }

        .module-detail-header:hover {
            background: linear-gradient(135deg, var(--light-navy) 0%, var(--teal) 100%);
        }

        .module-header-text h2 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .module-header-text p {
            font-size: 14px;
            opacity: 0.9;
        }

        .module-toggle {
            font-size: 28px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .module-detail-content {
            padding: 40px;
            display: block;
            animation: slideDown 0.3s ease;
        }

        .module-detail-content.collapsed {
            display: none;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Knowledge Section */
        .knowledge-section {
            margin-bottom: 40px;
        }

        .section-label {
            font-size: 16px;
            font-weight: bold;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::before {
            content: '◆';
            color: var(--gold);
        }

        .knowledge-items {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 0;
        }

        .knowledge-tag {
            background: var(--bg-light);
            border: 1px solid var(--teal);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--teal);
            transition: all 0.2s ease;
        }

        .knowledge-tag:hover {
            background: var(--teal);
            color: white;
            transform: translateY(-2px);
        }

        /* Product Section */

            margin-top: 40px;
            padding-top: 40px;
            border-top: 3px solid var(--gold);
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        .product-card {
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .product-card:hover {
            border-color: var(--gold);
            box-shadow: 0 8px 20px rgba(184, 134, 11, 0.2);

        }

        .product-header {
            background: linear-gradient(135deg, var(--gold) 0%, #D4A017 100%);
            color: white;
            padding: 16px;
            text-align: center;
        }

        .product-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .product-category {
            font-size: 12px;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 12px;
            display: inline-block;

        .product-body {

        }

        .efficacy-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .efficacy-list {
            list-style: none;
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-primary);

            padding: 6px 0;
            display: flex;
            gap: 8px;

        .efficacy-item::before {
            content: '→';
            color: var(--teal);
            font-weight: bold;
            flex-shrink: 0;
            min-width: 12px;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Microsoft JhengHei', sans-serif;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-primary {
            background-color: var(--teal);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--navy);
            box-shadow: 0 4px 12px rgba(0, 107, 125, 0.3);
        }

        .btn-secondary {
            background-color: var(--bg-light);
            color: var(--navy);
            border: 2px solid var(--teal);

        .btn-secondary:hover {
            background-color: var(--teal);

            color: var(--text-secondary);

            color: var(--text-secondary);

                text-align: center;

                font-size: 24px;
            }

                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }

                grid-template-columns: 1fr;
            }

                this.allModules = moduleDatabase;
                this.filteredModules = JSON.parse(JSON.stringify(moduleDatabase));
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.render();
            }

            setupEventListeners() {
                document.getElementById('searchInput').addEventListener('input', (e) => this.handleSearch(e.target.value));
                document.getElementById('expandAllBtn').addEventListener('click', () => this.expandAll());
                document.getElementById('collapseAllBtn').addEventListener('click', () => this.collapseAll());
                document.getElementById('resetBtn').addEventListener('click', () => this.reset());
            }

            handleSearch(query) {
                const q = String(query).toLowerCase().trim();
                this.filteredModules = {};
                
                if (!q) {
                    this.filteredModules = JSON.parse(JSON.stringify(this.allModules));
                } else {
                    Object.entries(this.allModules).forEach(([id, module]) => {
                        if (module.title.toLowerCase().includes(q) || 
                            module.items.some(item => item.toLowerCase().includes(q))) {
                            this.filteredModules[id] = module;
                        }
                    });
                }
                
                this.render();
            }

            expandAll() {
                document.querySelectorAll('.module-toggle').forEach(toggle => {
                    toggle.classList.remove('collapsed');
                    toggle.closest('.module-detail-header').nextElementSibling.classList.remove('collapsed');
                });
            }

            collapseAll() {
                document.querySelectorAll('.module-toggle').forEach(toggle => {
                    toggle.classList.add('collapsed');
                    toggle.closest('.module-detail-header').nextElementSibling.classList.add('collapsed');
                });
            }

            reset() {
                document.getElementById('searchInput').value = '';
                this.filteredModules = JSON.parse(JSON.stringify(this.allModules));
                this.render();
                this.collapseAll();
            }

            getProductsForModule(moduleId) {
                return Object.entries(productDatabase)
                    .filter(([_, product]) => product.modules.includes(moduleId))
                    .reduce((acc, [name, data]) => {
                        acc[name] = data;
                        return acc;
                    }, {});
            }

            render() {
                if (Object.keys(this.filteredModules).length === 0) {
                    document.getElementById('modulesDetailContainer').innerHTML = '<div class="no-results">未找到匹配的模組</div>';
                    return;
                }

                // Quick Grid
                document.getElementById('modulesQuickGrid').innerHTML = Object.entries(this.filteredModules)
                    .map(([id, module]) => `
                        <div class="module-quick-card" data-module-id="${id}">
                            <div class="module-number">模組 ${id}</div>
                            <div class="module-title">${module.title}</div>
                            <div class="module-count">${module.items.length} 個知識項 + ${Object.keys(this.getProductsForModule(id)).length} 款產品</div>
                        </div>
                    `).join('');

                // Detail Sections
                document.getElementById('modulesDetailContainer').innerHTML = Object.entries(this.filteredModules)
                    .map(([id, module]) => {
                        const products = this.getProductsForModule(id);
                        return `
                            <div class="module-detail-section">
                                <div class="module-detail-header" data-module="${id}">
                                    <div class="module-header-text">
                                        <h2>${module.title}</h2>
                                        <p>模組 ${id} • ${module.items.length} 個知識項 • ${Object.keys(products).length} 款對應產品</p>
                                    </div>
                                    <div class="module-toggle">▼</div>
                                </div>
                                <div class="module-detail-content collapsed">
                                    <div class="knowledge-section">
                                        <div class="section-label">知識項目</div>
                                        <div class="knowledge-items">
                                            ${module.items.map(item => `<div class="knowledge-tag">${item}</div>`).join('')}
                                        </div>
                                    </div>
                                    
                                    <div class="product-section">
                                        <div class="section-label">對應產品方案</div>
                                        <div class="product-grid">
                                            ${Object.entries(products).map(([name, data]) => `
                                                <div class="product-card">
                                                    <div class="product-header">
                                                        <div class="product-name">${name}</div>
                                                        <div class="product-category">${data.category}</div>
                                                    </div>
                                                    <div class="product-body">
                                                        <div class="efficacy-title">功效</div>
                                                        <ul class="efficacy-list">
                                                            ${data.efficacies.map(e => `<li class="efficacy-item">${e}</li>`).join('')}
                                                        </ul>
                                                    </div>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');

                this.attachEventListeners();
            }

            attachEventListeners() {
                // Quick card click handlers
                document.querySelectorAll('.module-quick-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const moduleId = card.getAttribute('data-module-id');
                        const header = document.querySelector(`[data-module="${moduleId}"]`);
                        if (header) {
                            header.click();
                        }
                    });
                });

                // Module header click handlers
                document.querySelectorAll('.module-detail-header').forEach(header => {
                    header.addEventListener('click', () => {
                        const toggle = header.querySelector('.module-toggle');
                        const content = header.nextElementSibling;
                        
                        toggle.classList.toggle('collapsed');
                        content.classList.toggle('collapsed');
                    });
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const app = new HealthNegEntropyApp();
            
            // Expose search to global for integration
            window.appSearch = (query) => {
                app.handleSearch(query);
            };
        });
    </script>
</body>
</html>
