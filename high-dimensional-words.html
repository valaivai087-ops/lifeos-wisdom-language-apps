    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
      background: #ffffff;
      color: #0D1B3E;
      line-height: 1.8;
    }

    :root {
      --navy: #0D1B3E;
      --gold: #B8860B;
      --teal: #006B7D;
      --light-navy: #1A2B5F;
      --light-gray: #F5F7FA;
      --border-color: #E0E8F0;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--teal) 100%);
      color: white;
      padding: 3rem 2rem;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    .header h1 {
      font-size: 2.4rem;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.95;
      letter-spacing: 0.5px;
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: 'Microsoft JhengHei', sans-serif;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--gold);
    }

    .category-filters {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.7rem 1.2rem;
      border: 2px solid var(--border-color);
      background: white;
      color: var(--navy);
      cursor: pointer;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: all 0.3s;
      font-family: 'Microsoft JhengHei', sans-serif;
    }

    .filter-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .filter-btn.active {
      background: var(--navy);
      color: var(--gold);
      border-color: var(--navy);
    }

    /* Stats */
    .stats {
      background: var(--light-gray);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-around;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--gold);
    }

    .stat-label {
      font-size: 0.95rem;
      color: var(--light-navy);
      margin-top: 0.3rem;
    }

    /* Cards Grid */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 1.8rem;
      margin-bottom: 2rem;
    }

    .card {
      background: white;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 1.8rem;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: var(--gold);
      box-shadow: 0 8px 24px rgba(13, 27, 62, 0.1);
      transform: translateY(-2px);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--gold);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .card:hover::before {
      opacity: 1;
    }

    .card-category {
      display: inline-block;
      background: var(--light-gray);
      color: var(--teal);
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
      letter-spacing: 0.5px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--navy);
      margin-bottom: 0.3rem;
    }

    .card-title-en {
      font-size: 1rem;
      color: var(--teal);
      font-style: italic;
      margin-bottom: 0.8rem;
      font-weight: 500;
    }

    .card-definition {
      font-size: 0.95rem;
      color: var(--light-navy);
      margin-bottom: 0.5rem;
      line-height: 1.6;
    }

    .card-definition-en {
      font-size: 0.9rem;
      color: #666;
      font-style: italic;
      margin-bottom: 1rem;
    }

    .card-toggle {
      color: var(--gold);
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .toggle-icon {
      transition: transform 0.3s;
    }

    .card.expanded .toggle-icon {
      transform: rotate(180deg);
    }

    /* Expanded Content */
    .card-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease-out;
    }

    .card.expanded .card-content {
      max-height: 1000px;
    }

    .content-section {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .section-title {
      font-weight: 700;
      color: var(--navy);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-content {
      font-size: 0.95rem;
      color: var(--light-navy);
      line-height: 1.7;
      margin-bottom: 0.8rem;
    }

    .section-content-en {
      font-size: 0.9rem;
      color: #666;
      line-height: 1.7;
      font-style: italic;
    }

    .related-terms {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .tag {
      background: var(--light-navy);
      color: white;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.8rem;
      white-space: nowrap;
    }

    .tag-en {
      background: var(--teal);
    }

    .tts-btn {
      background: var(--gold);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 0.8rem;
      transition: all 0.3s;
      font-family: 'Microsoft JhengHei', sans-serif;
    }

    .tts-btn:hover {
      background: var(--navy);
      transform: scale(1.05);
    }

    .tts-btn.playing {
      animation: pulse 0.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--light-navy);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .empty-state h2 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 2rem;
      background: var(--light-gray);
      border-top: 2px solid var(--border-color);
      margin-top: 3rem;
      color: var(--light-navy);
      font-size: 0.95rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .controls {
        flex-direction: column;
        gap: 1rem;
      }

      .search-box {
        min-width: unset;
      }

      .category-filters {
        justify-content: center;
      }

      .stats {
        gap: 1rem;
      }
    }

    /* Print Friendly */
    @media print {
      .controls, .header::after {
        display: none;
      }

      .card {
        page-break-inside: avoid;
      }
    }
  </style>

    // State management
    let filteredData = [...vocabularyData];
    let activeCategory = 'all';

    // Initialize
    function init() {
      renderCategoryFilters();
      updateStats();
      renderCards();
    }

    // Render category filters
    function renderCategoryFilters() {
      const filterContainer = document.getElementById('categoryFilters');
      const categories = ['all', ...new Set(vocabularyData.map(item => item.category))];
      
      filterContainer.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === 'all' ? 'active' : ''}" onclick="filterByCategory('${cat}')">
          ${cat === 'all' ? '所有類別' : cat}
        </button>
      `).join('');
    }

    // Filter by category
    window.filterByCategory = function(category) {
      activeCategory = category;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.includes(category === 'all' ? '所有' : category));
      });
      
      if (category === 'all') {
        filteredData = [...vocabularyData];
      } else {
        filteredData = vocabularyData.filter(item => item.category === category);
      }
      
      const searchValue = document.getElementById('searchInput').value;
      if (searchValue) {
        filteredData = filteredData.filter(item => 
          item.chinese.includes(searchValue) || 
          item.english.toLowerCase().includes(searchValue.toLowerCase())
        );
      }
      
      updateStats();
      renderCards();
    };

    // Search
    document.getElementById('searchInput')?.addEventListener('input', function(e) {
      const value = e.target.value.toLowerCase();
      
      if (activeCategory === 'all') {
        filteredData = vocabularyData.filter(item =>
          item.chinese.includes(value) ||
          item.english.toLowerCase().includes(value) ||
          item.definition.includes(value)
        );
      } else {
        filteredData = vocabularyData
          .filter(item => item.category === activeCategory)
          .filter(item =>
            item.chinese.includes(value) ||
            item.english.toLowerCase().includes(value) ||
            item.definition.includes(value)
          );
      }
      
      updateStats();
      renderCards();
    });

    // Update stats
    function updateStats() {
      document.getElementById('totalCount').textContent = vocabularyData.length;
      document.getElementById('displayCount').textContent = filteredData.length;
    }

    // Render cards
    function renderCards() {
      const container = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');
      
      if (filteredData.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      container.innerHTML = filteredData.map(item => `
        <div class="card" data-id="${item.id}">
          <div class="card-category">${item.category}</div>
          <div class="card-title">${item.chinese}</div>
          <div class="card-title-en">${item.english}</div>
          <div class="card-definition">${item.definition}</div>
          <div class="card-definition-en">${item.definitionEn}</div>
          
          <button class="tts-btn" onclick="speakEnglish(${item.id})" style="width: 100%; margin: 1rem 0 0.5rem 0;">
            🔊 播放英文 / Speak English
          </button>
          
          <div class="card-content">
            <div class="content-section">
              <div class="section-title">核心意涵 / Core Essence</div>
              <div class="section-content">${item.essence}</div>
              <div class="section-content-en">${item.essenceEn}</div>
            </div>
            
            <div class="content-section">
              <div class="section-title">實踐應用 / Practical Application</div>
              <div class="section-content">${item.application}</div>
              <div class="section-content-en">${item.applicationEn}</div>
            </div>
            
            <div class="content-section">
              <div class="section-title">相關詞彙 / Related Terms</div>
              <div class="related-terms">
                ${item.relatedTerms.map(term => `<span class="tag">${term}</span>`).join('')}
                ${item.relatedTermsEn.map(term => `<span class="tag tag-en">${term}</span>`).join('')}
              </div>
            </div>
          </div>
          
          <div class="card-toggle" onclick="toggleCard(this)">
            <span>展開詳情 / Expand</span>
            <span class="toggle-icon">▼</span>
          </div>
        </div>
      `).join('');
      
      // Add click handlers
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', function(e) {
          if (e.target.closest('.tts-btn')) return;
          toggleCard(this.querySelector('.card-toggle'));
        });
      });
    }

    // Toggle card expansion
    window.toggleCard = function(toggleElement) {
      const card = toggleElement.closest('.card');
      card.classList.toggle('expanded');
    };

    // Text-to-speech
    window.speakEnglish = function(id) {
      const item = vocabularyData.find(v => v.id === id);
      if (!item || !('speechSynthesis' in window)) return;
      
      window.speechSynthesis.cancel();
      
      const textToSpeak = `${item.english}. ${item.definitionEn}. ${item.essenceEn}`;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      
      const btn = document.querySelector(`[onclick="speakEnglish(${id})"]`);
      btn.classList.add('playing');
      utterance.onend = () => btn.classList.remove('playing');
      
      window.speechSynthesis.speak(utterance);
    };

    // Initialize on load
    document.addEventListener('DOMContentLoaded', init);
  </script>
